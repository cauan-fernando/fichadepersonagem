<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="trueinaciodasilva.css">
</head>
<body>
    <h2>ficha de personagem</h2>

<form>
  <label for="fname">nome</label>
  <input type="text" id="fname" name="firstname" placeholder="Your name..">

  <label for="lname">classe</label>
  <input type="text" id="lname" name="lastname" placeholder="Your class..">
  
  <label for="xp">XP</label>
  <input type="text" id="xp" experience="your xp" placeholder="Your xp..">

  <label for="country">raça</label>
  <select id="country" name="country">
    <option value="normal">humano(normal)</option>
    <option value="bombman">mulçumano</option>
    <option value="pobre">humanoanormal(nordestino)</option>
  </select>
  <br>
  <label for="xp">for</label>
  <input type="text" id="for" im strongoff="im strongoff" placeholder="im strongoff..">
  <br>
  <label for="xp">des</label>
  <input type="text" id="des" eu sou a velocidade="eu sou a velocidade" placeholder="eu sou a velocidade..">
  <br>
  <label for="xp">int</label>
  <input type="text" id="int" experience="bicho sabido" placeholder="bicho sabido..">
  <br>
  <label for="xp">car</label>
  <input type="text" id="car" experience="ceoofsex" placeholder="ceoofsex..">
  <br>
  <label for="xp">sab</label>
  <input type="text" id="sab" experience="eu sabo muito" placeholder="eu sabo muito..">
  <br>
  <label for="xp">con</label>
  <input type="text" id="con" experience="a vida é dura mas minha pompa é mais" placeholder="a vida é dura mas minha pompa é mais..">

  <input type="submit" value="Submit">
</form>

</body>
</html>
